[project]
name = "findex"
version = "0.4.0"
description = "Навчальна пошукова система на Python: інвертований індекс, BM25/TF-IDF, типізація та CLI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Student Developer" },
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "pyright>=1.1.380",
    "ruff>=0.6.0",
    "matplotlib>=3.9.0",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: позначає тести, виконання яких триває понад 1 секунду",
]

[tool.coverage.run]
source = ["findex"]
branch = true
omit = [
    "src/findex/__main__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
