name: CI

on:
  push:
    branches: ["main"]
    tags: ["lab-*", "v*"]
  pull_request:
    branches: ["main"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Strict type-check with pyright
        run: uv run pyright

      - name: Run pytest with coverage
        run: uv run pytest -v --cov=findex --cov-report=term-missing --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-benchmark
          path: benchmark-results.json
          if-no-files-found: ignore

      - name: Build wheel and verify clean installation
        run: |
          uv build
          uv venv /tmp/clean-findex-env
          uv pip install --python /tmp/clean-findex-env/bin/python dist/*.whl
          /tmp/clean-findex-env/bin/findex --help
